plugins {
    id 'com.android.application'
}

android {
    namespace 'de.privat.trainingsbuch'
    compileSdk 35

    defaultConfig {
        applicationId 'de.privat.trainingsbuch'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing-keystore.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
